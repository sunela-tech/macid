# XcodeGen spec for Mac ID. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# scripts/build-app.sh does this for you.
name: MacID
options:
  bundleIdPrefix: app.macid
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.7.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MacID:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacID
      - path: Resources
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    settings:
      base:
        PRODUCT_NAME: "Mac ID"
        PRODUCT_BUNDLE_IDENTIFIER: app.macid.MacID
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/MacID.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # Filled in from the environment by scripts/build-app.sh
        CLERK_PUBLISHABLE_KEY: ""
        MACID_PRICING_URL: "https://macid.app/pricing"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  MacID:
    build:
      targets:
        MacID: all
    run:
      config: Debug
      environmentVariables:
        CLERK_PUBLISHABLE_KEY: ""
    archive:
      config: Release
