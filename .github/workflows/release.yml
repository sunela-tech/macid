# Builds Mac ID and attaches the .dmg and .pkg to the run (and to a release for v* tags).
#
# Repository settings:
#   Variables: CLERK_PUBLISHABLE_KEY, MACID_PRICING_URL
#   Secrets (optional, for signed + notarized builds):
#     MACOS_CERTS_P12        base64 of a .p12 holding "Developer ID Application" and "Developer ID Installer"
#     MACOS_CERTS_PASSWORD   password of that .p12
#     SIGN_IDENTITY          e.g. Developer ID Application: Your Name (TEAMID)
#     INSTALLER_IDENTITY     e.g. Developer ID Installer: Your Name (TEAMID)
#     DEVELOPMENT_TEAM       your team ID
#     NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific password), NOTARY_TEAM_ID
name: Build Mac ID

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      MACID_PRICING_URL: ${{ vars.MACID_PRICING_URL }}
      XCBEAUTIFY_RENDERER: github-actions
      HAS_CERTS: ${{ secrets.MACOS_CERTS_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificates
        if: env.HAS_CERTS == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTS_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          xcrun notarytool store-credentials macid-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" --password "${{ secrets.NOTARY_PASSWORD }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" --keychain "$KEYCHAIN"
          {
            echo "SIGN_IDENTITY=${{ secrets.SIGN_IDENTITY }}"
            echo "INSTALLER_IDENTITY=${{ secrets.INSTALLER_IDENTITY }}"
            echo "DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}"
            echo "NOTARY_PROFILE=macid-notary"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="1.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh

      - name: Notarize app
        if: env.HAS_CERTS == 'true'
        run: |
          ditto -c -k --keepParent "build/Mac ID.app" build/MacID-notarize.zip
          xcrun notarytool submit build/MacID-notarize.zip --keychain-profile "$NOTARY_PROFILE" --wait
          xcrun stapler staple "build/Mac ID.app"

      - name: Make .dmg
        run: ./scripts/make-dmg.sh

      - name: Make .pkg
        run: ./scripts/make-pkg.sh

      - uses: actions/upload-artifact@v5
        with:
          name: MacID-${{ env.VERSION }}
          path: |
            build/MacID-*.dmg
            build/MacID-*.pkg

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacID-*.dmg
            build/MacID-*.pkg
