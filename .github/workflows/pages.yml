# Publishes web/ (the Clerk pricing page) to https://sunela-tech.github.io/macid/pricing/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions",
# then run this workflow (Actions → Pricing page → Run workflow).
name: Pricing page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skip quietly until Pages is switched on, so main doesn't show a failed run.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
